apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:stable

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

          # Startup Probe
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  nginx -t >/dev/null 2>&1 &&
                  test -s /var/run/nginx.pid &&
                  kill -0 "$(cat /var/run/nginx.pid)"
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          # Liveness Probe
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Readiness Probe
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
