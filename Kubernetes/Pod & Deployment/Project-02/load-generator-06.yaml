apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: deploy-lab
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 360
  containers:
    - name: load
      image: busybox:1.36.1
      command: ["sh", "-c"]
      args: ['for i in 1 2 3 4; do (while true; do wget -q -O /dev/null http://checkout-api; done) & done; sleep 300']
      resources:
        requests:
          cpu: 50m
          memory: 8Mi
        limits:
          cpu: 200m
          memory: 32Mi
